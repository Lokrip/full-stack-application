#описываем источник данных тоесть нажу базу данных
spring:
  datasource:
    #указываем tc тоесть будет использовать драйвер
    #test containers каторый автоматический будет запускать контейнер
    #с указонной базой данных после : мы указываем название образа
    #каторый мы собираемся использовать для тестирования
    #selmag это имя базы данных каторая создасться

    #TC_DAEMON запускает контейнер в "демон"-режиме (то есть в фоне);
    #означает, что контейнер будет оставаться активным даже после завершения первого подключения;
    #позволяет использовать контейнер повторно в рамках всего процесса, что делает тесты быстрее
    #(так как база не пересоздаётся каждый раз заново).

    #jdbc:tc:postgresql:17:///selmag?TC_DAEMON=true, Testcontainers сам управляет контейнером,
    #и ты не указываешь явно host и port, потому что
    #Контейнер работает внутри JVM процесса (как часть тестов).
    #JDBC-драйвер автоматически подключается к нему, без необходимости вручную указывать host и port

    url: jdbc:tc:postgresql:16:///selmag?TC_DAEMON=true&characterEncoding=UTF-8
    username: selmag
    password: selmag

    #Без него будет ошибка
    #Ошибка, которую ты видишь, указывает на проблему с инициализацией
    #источника данных в Spring Boot,
    #а именно с драйвером подключения для базы данных. Рассмотрим её подробнее:
    #Spring Boot ожидает стандартный PostgreSQL драйвер (org.postgresql.Driver),
    #но ты используешь URL, который автоматически запускает контейнер с
    #базой данных с помощью Testcontainers (с помощью префикса jdbc:tc:postgresql:16).
    #Этот драйвер не может быть использован с JDBC URL jdbc:tc:postgresql:,
    #так как стандартный драйвер PostgreSQL не поддерживает работу
    #с контейнерами, а Testcontainers требует специального драйвера для своей работы.
    #Для того чтобы Testcontainers правильно работал с этим URL, тебе нужно указать
    #специальный драйвер org.testcontainers.jdbc.ContainerDatabaseDriver,
    #который поддерживает запуск контейнера с базой данных.
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
