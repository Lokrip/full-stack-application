spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:2345/catalogue
    username: catalogue
    password: catalogue
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    schemas:
      - public
      - catalogue
server:
  port: 8081

logging:
 level:
  sql: info
