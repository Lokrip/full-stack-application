spring.application.name=manager-app

server.port=8081
#В spring.profiles.active указываются активные профили Spring,
#которые определяют, какие настройки
#(конфигурационные файлы, бины и т. д.) будут использоваться в приложении.
spring.profiles.active=docker,k8s,other,local

#Если указан spring.profiles.active=dev,debug, Spring ищет файлы
#application-dev.yml | application-dev.properties
#application-debug.yml application-debug.properties
#Если их нет, Spring просто использует доступные настройки из application.yml или application.properties.
